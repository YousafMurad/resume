<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yousaf Murad — Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --border: #262626;
      --border-subtle: #171717;
      --text: #ededed;
      --text-muted: #a1a1aa;
      --font-mono: 'Geist Mono', monospace, ui-monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation bar */
    .nav-bar {
      width: 100%;
      max-width: 1024px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(12px);
      margin-bottom: 20px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: -0.01em;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #171717;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
    }

    .title {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      cursor: pointer;
    }

    /* Vercel-style solid white primary */
    .btn-primary {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }

    .btn-primary:hover {
      background: #eaeaea;
    }

    /* GitHub-style dark secondary */
    .btn-secondary {
      background: #171717;
      color: #ededed;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #262626;
      border-color: #404040;
    }

    /* Document preview container */
    .viewer-card {
      width: 100%;
      max-width: 1024px;
      height: 82vh;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-topbar {
      height: 36px;
      border-bottom: 1px solid var(--border);
      background: #0d0d0d;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    iframe {
      width: 100%;
      height: calc(100% - 36px);
      border: none;
      background: #121212;
    }

    footer {
      width: 100%;
      max-width: 1024px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #71717a;
      padding: 0 4px;
    }

    @media (max-width: 640px) {
      .nav-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .actions {
        width: 100%;
      }
      .btn {
        flex: 1;
        justify-content: center;
      }
      .title {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header class="nav-bar">
    <div class="identity">
      <span class="name">Yousaf Murad</span>
      <span class="badge">QA Engineer</span>
    </div>

    <div class="actions">
      <a class="btn btn-secondary" href="./YousafMurad_Resume_Senior_QAEngineer.pdf" target="_blank">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        Full Window
      </a>
      <a class="btn btn-primary" href="./YousafMurad_Resume_Senior_QAEngineer.pdf" download>
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download
      </a>
    </div>
  </header>

  <main class="viewer-card">
    <div class="card-topbar">
      <span>YousafMurad_Resume_Senior_QAEngineer.pdf</span>
    </div>
    <iframe src="./YousafMurad_Resume_Senior_QAEngineer.pdf#toolbar=0&navpanes=0"></iframe>
  </main>

  <footer>
    <span>status: active</span>
    <span>hosted via github pages</span>
  </footer>

</body>
</html>
